<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - TVET Mastermind</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { display: flex; min-height: 100vh; }
        
        /* Left Side - Dark Blue */
        .signup-left {
            flex: 1;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px;
            position: relative;
            overflow: hidden;
        }
        
        .signup-left::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(245, 158, 11, 0.1);
            border-radius: 50%;
            top: -100px;
            left: -100px;
        }
        
        .signup-left::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(245, 158, 11, 0.05);
            border-radius: 50%;
            bottom: -50px;
            right: -50px;
        }
        
        .graduation-icon {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
            box-shadow: 0 10px 40px rgba(245, 158, 11, 0.3);
        }
        
        .graduation-icon svg { width: 64px; height: 64px; fill: white; }
        
        .welcome-title {
            color: white;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 16px;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        
        .welcome-description {
            color: #94a3b8;
            font-size: 1rem;
            text-align: center;
            max-width: 400px;
            line-height: 1.6;
            position: relative;
            z-index: 1;
        }

        /* Right Side - White */
        .signup-right {
            flex: 1;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px;
            overflow-y: auto;
        }

        .signup-container {
            width: 100%;
            max-width: 440px;
        }

        .signup-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
            cursor: pointer;
        }

        .signup-logo-icon {
            width: 48px;
            height: 48px;
            background: #f59e0b;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.5rem;
        }

        .signup-logo-text {
            font-size: 1.25rem;
            font-weight: 700;
            color: #111827;
        }

        .signup-header {
            margin-bottom: 28px;
        }

        .signup-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #111827;
            margin-bottom: 8px;
        }

        .signup-header p {
            color: #6b7280;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #111827;
            transition: all 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1);
        }

        .form-group input::placeholder {
            color: #9ca3af;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 24px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #f59e0b;
            cursor: pointer;
            margin-top: 2px;
        }

        .checkbox-group label {
            font-size: 0.875rem;
            color: #6b7280;
            cursor: pointer;
            line-height: 1.4;
        }

        .checkbox-group a {
            color: #f59e0b;
            text-decoration: none;
            font-weight: 600;
        }

        .checkbox-group a:hover {
            color: #d97706;
            text-decoration: underline;
        }

        .sign-up-btn {
            width: 100%;
            padding: 14px;
            background: #f59e0b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 20px;
        }

        .sign-up-btn:hover {
            background: #d97706;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        .sign-up-btn:active {
            transform: translateY(0);
        }

        .signin-link {
            text-align: center;
            font-size: 0.9rem;
            color: #6b7280;
        }

        .signin-link a {
            color: #f59e0b;
            text-decoration: none;
            font-weight: 600;
        }

        .signin-link a:hover {
            color: #d97706;
        }

        .error-message {
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.875rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #9ca3af;
            font-size: 0.85rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }

        .divider span {
            padding: 0 16px;
        }

        .social-signup {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .social-btn {
            flex: 1;
            padding: 12px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #374151;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .social-btn:hover {
            background: #f9fafb;
            border-color: #d1d5db;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .signup-left { display: none; }
            .signup-right { padding: 40px 20px; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- Left Side -->
    <div class="signup-left">
        <div class="graduation-icon">
            <svg viewBox="0 0 24 24">
                <path d="M12 3L1 9l11 6 9-4.91V17h2V9M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/>
            </svg>
        </div>
        <h1 class="welcome-title">Join TVET Mastermind</h1>
        <p class="welcome-description">
            Start your vocational and technical education journey today. 
            Access interactive modules, track your progress, and earn achievements.
        </p>
    </div>

    <!-- Right Side -->
    <div class="signup-right">
        <div class="signup-container">
            <div class="signup-logo" onclick="window.location.href='login.html'">
                <div class="signup-logo-icon">TM</div>
                <div class="signup-logo-text">TVET Mastermind</div>
            </div>

            <div class="signup-header">
                <h1>Create account</h1>
                <p>Start your learning journey with us</p>
            </div>

            <div id="errorMessage" class="error-message"></div>

            <form id="signupForm" onsubmit="handleSignup(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" id="firstName" placeholder="Ahmad" required>
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" id="lastName" placeholder="Naufal" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="you@student.edu.my" required>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" placeholder="+60 12-345 6789">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="At least 8 characters" required minlength="8">
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Re-enter your password" required>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
                </div>

                <button type="submit" class="sign-up-btn" id="submitBtn">Create Account</button>
            </form>

            <p class="signin-link">
                Already have an account? <a href="login.html">Sign in</a>
            </p>
        </div>
    </div>

    <script>
        // ===== CONFIGURATION =====
        const API_BASE_URL = 'http://localhost:3000/api'; // Change to your backend URL
        const SIGNUP_ENDPOINT = '/auth/register'; // Your signup endpoint
        const LOGIN_URL = 'login.html';
        
        // ===== SIGNUP FUNCTION =====
        async function handleSignup(e) {
            e.preventDefault();
            
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('submitBtn');
            const errorMessage = document.getElementById('errorMessage');
            
            // Clear previous errors
            errorMessage.classList.remove('show');
            errorMessage.textContent = '';
            
            // Validate passwords match
            if (password !== confirmPassword) {
                errorMessage.textContent = 'Passwords do not match';
                errorMessage.classList.add('show');
                return;
            }
            
            // Validate password strength
            if (password.length < 8) {
                errorMessage.textContent = 'Password must be at least 8 characters';
                errorMessage.classList.add('show');
                return;
            }
            
            // Disable button and show loading
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating account...';
            
            try {
                const response = await fetch(`${API_BASE_URL}${SIGNUP_ENDPOINT}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        firstName: firstName,
                        lastName: lastName,
                        email: email,
                        phone: phone,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Signup successful
                    alert('Account created successfully! Please sign in.');
                    window.location.href = LOGIN_URL;
                } else {
                    throw new Error(data.message || data.error || 'Signup failed. Please try again.');
                }
                
            } catch (error) {
                console.error('Signup error:', error);
                errorMessage.textContent = error.message || 'Connection error. Please try again.';
                errorMessage.classList.add('show');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
            }
        }
    </script>
</body>
</html>
