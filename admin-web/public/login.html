<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TVET Mastermind</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { display: flex; min-height: 100vh; }
        .login-left { flex: 1; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px; position: relative; overflow: hidden; }
        .login-left::before { content: ''; position: absolute; width: 400px; height: 400px; background: rgba(245, 158, 11, 0.1); border-radius: 50%; top: -100px; left: -100px; }
        .login-left::after { content: ''; position: absolute; width: 300px; height: 300px; background: rgba(245, 158, 11, 0.05); border-radius: 50%; bottom: -50px; right: -50px; }
        .graduation-icon { width: 120px; height: 120px; background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 30px; position: relative; z-index: 1; box-shadow: 0 10px 40px rgba(245, 158, 11, 0.3); }
        .graduation-icon svg { width: 64px; height: 64px; fill: white; }
        .welcome-title { color: white; font-size: 2rem; font-weight: 700; margin-bottom: 16px; text-align: center; position: relative; z-index: 1; }
        .welcome-description { color: #94a3b8; font-size: 1rem; text-align: center; max-width: 400px; line-height: 1.6; position: relative; z-index: 1; }
        .login-right { flex: 1; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px; }
        .login-container { width: 100%; max-width: 400px; }
        .login-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; }
        .login-logo-icon { width: 48px; height: 48px; background: #f59e0b; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 1.5rem; }
        .login-logo-text { font-size: 1.25rem; font-weight: 700; color: #111827; }
        .login-header { margin-bottom: 32px; }
        .login-header h1 { font-size: 1.75rem; font-weight: 700; color: #111827; margin-bottom: 8px; }
        .login-header p { color: #6b7280; font-size: 0.95rem; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.875rem; font-weight: 600; color: #374151; margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 12px 16px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 0.95rem; color: #111827; transition: all 0.2s; }
        .form-group input:focus { outline: none; border-color: #f59e0b; box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1); }
        .form-group input::placeholder { color: #9ca3af; }
        .form-options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .remember-me { display: flex; align-items: center; gap: 8px; }
        .remember-me input[type="checkbox"] { width: 16px; height: 16px; accent-color: #f59e0b; cursor: pointer; }
        .remember-me label { font-size: 0.875rem; color: #6b7280; cursor: pointer; }
        .forgot-password { font-size: 0.875rem; color: #f59e0b; text-decoration: none; font-weight: 600; }
        .forgot-password:hover { color: #d97706; }
        .sign-in-btn { width: 100%; padding: 14px; background: #f59e0b; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-bottom: 20px; }
        .sign-in-btn:hover { background: #d97706; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3); }
        .sign-in-btn:active { transform: translateY(0); }
        .sign-in-btn:disabled { background: #fbbf24; cursor: not-allowed; transform: none; }
        .error-message { background: #fee2e2; border: 1px solid #fecaca; color: #dc2626; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 0.875rem; display: none; }
        .error-message.show { display: block; }
        .signup-link { text-align: center; font-size: 0.9rem; color: #6b7280; }
        .signup-link a { color: #f59e0b; text-decoration: none; font-weight: 600; }
        .signup-link a:hover { color: #d97706; }
        @media (max-width: 768px) { .login-left { display: none; } .login-right { padding: 40px 20px; } }
    </style>
</head>
<body>
    <div class="login-left">
        <div class="graduation-icon">
            <svg viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>
        </div>
        <h1 class="welcome-title">Welcome to TVET Mastermind</h1>
        <p class="welcome-description">The modern learning platform for vocational and technical education. Learn through modules and master skills through interactive games.</p>
    </div>

    <div class="login-right">
        <div class="login-container">
            <div class="login-logo">
                <div class="login-logo-icon">TM</div>
                <div class="login-logo-text">TVET Mastermind</div>
            </div>

            <div class="login-header">
                <h1>Welcome back</h1>
                <p>Sign in to continue your learning journey</p>
            </div>

            <div id="errorMessage" class="error-message"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="you@student.edu.my" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <div class="form-options">
                    <div class="remember-me">
                        <input type="checkbox" id="remember">
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="sign-in-btn" id="submitBtn">Sign In</button>
            </form>

            <p class="signup-link">
    Don't have an account? <a href="signup.html">Sign up free</a>
</p>
        </div>
    </div>

    <script>
        // ===== CONFIGURATION =====
        const API_BASE_URL = 'http://172.31.99.168:3306/'; // Change this to your backend URL
        const LOGIN_ENDPOINT = '/auth/login'; // Your login endpoint
        const DASHBOARD_URL = 'index.html'; // Where to redirect after login
        
        // ===== LOGIN FUNCTION =====
        async function handleLogin(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('remember').checked;
            const submitBtn = document.getElementById('submitBtn');
            const errorMessage = document.getElementById('errorMessage');
            
            // Clear previous errors
            errorMessage.classList.remove('show');
            errorMessage.textContent = '';
            
            // Disable button and show loading
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';
            
            try {
                // Make API request
                const response = await fetch(`${API_BASE_URL}${LOGIN_ENDPOINT}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Login successful
                    
                    // Store token (adjust based on your API response)
                    const token = data.token || data.accessToken || data.data?.token;
                    const user = data.user || data.data?.user || { email: email };
                    
                    if (token) {
                        if (rememberMe) {
                            localStorage.setItem('token', token);
                            localStorage.setItem('user', JSON.stringify(user));
                        } else {
                            sessionStorage.setItem('token', token);
                            sessionStorage.setItem('user', JSON.stringify(user));
                        }
                    }
                    
                    // Store user info
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userEmail', email);
                    
                    // Redirect to dashboard
                    window.location.href = DASHBOARD_URL;
                    
                } else {
                    // Login failed
                    throw new Error(data.message || data.error || 'Invalid email or password');
                }
                
            } catch (error) {
                console.error('Login error:', error);
                
                // Show error message
                errorMessage.textContent = error.message || 'Connection error. Please try again.';
                errorMessage.classList.add('show');
                
                // Re-enable button
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        }
        
        // ===== CHECK IF ALREADY LOGGED IN =====
        window.addEventListener('load', () => {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            if (token) {
                // User is already logged in, redirect to dashboard
                window.location.href = DASHBOARD_URL;
            }
        });
    </script>
</body>
</html>
